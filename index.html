<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hasibur’s Career OS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f8fafc;--card:#ffffff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--acc:#3b82f6;--acc-ink:#fff;--warn:#f59e0b;--ok:#22c55e;--danger:#ef4444;--shadow:0 4px 20px -6px rgba(0,0,0,.06);--shadow-lg:0 10px 40px -12px rgba(0,0,0,.15);--radius:20px;--radius-sm:12px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#030712;--card:#111827;--ink:#f8fafc;--mute:#94a3b8;--line:#1f2937;--acc:#60a5fa;--acc-ink:#0b0f19;--warn:#fbbf24;--ok:#4ade80;--danger:#f87171;--shadow:0 4px 20px -6px rgba(0,0,0,.4);--shadow-lg:0 10px 40px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root{--bg:#f8fafc;--card:#ffffff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--acc:#3b82f6;--acc-ink:#fff;--warn:#f59e0b;--ok:#22c55e;--danger:#ef4444;--shadow:0 4px 20px -6px rgba(0,0,0,.06);--shadow-lg:0 10px 40px -12px rgba(0,0,0,.15);--radius:20px;--radius-sm:12px;--card-alpha:0.75;--nav-blur:20;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#030712;--card:#111827;--ink:#f8fafc;--mute:#94a3b8;--line:#1f2937;--acc:#60a5fa;--acc-ink:#0b0f19;--warn:#fbbf24;--ok:#4ade80;--danger:#f87171;--shadow:0 4px 20px -6px rgba(0,0,0,.4);--shadow-lg:0 10px 40px -12px rgba(0,0,0,.6);--card-alpha:0.75;--nav-blur:20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#030712;--card:#111827;--ink:#f8fafc;--mute:#94a3b8;--line:#1f2937;--acc:#60a5fa;--acc-ink:#0b0f19;--warn:#fbbf24;--ok:#4ade80;--danger:#f87171;--shadow:0 4px 20px -6px rgba(0,0,0,.4);--shadow-lg:0 10px 40px -12px rgba(0,0,0,.6);--card-alpha:0.75;--nav-blur:20;color-scheme:dark}
:root[data-theme="dark"]{--bg:#030712;--card:#111827;--ink:#f8fafc;--mute:#94a3b8;--line:#1f2937;--acc:#60a5fa;--acc-ink:#0b0f19;--warn:#fbbf24;--ok:#4ade80;--danger:#f87171;--shadow:0 4px 20px -6px rgba(0,0,0,.4);--shadow-lg:0 10px 40px -12px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Inter",system-ui,sans-serif;overflow-x:hidden;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% -10%,rgba(59,130,246,.08),transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(245,158,11,.06),transparent 50%);pointer-events:none;z-index:0}
.app{max-width:430px;margin:0 auto;padding:24px 18px;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
.theme-toggle{position:fixed;top:14px;right:14px;z-index:40;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(var(--card),0.8);backdrop-filter:blur(var(--nav-blur)) saturate(180%);color:var(--ink);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);transition:all .25s cubic-bezier(.4,0,.2,1);font-size:20px}
.theme-toggle:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--shadow-lg);border-color:var(--acc)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
h1{font-size:32px;font-weight:700;letter-spacing:-.02em}
h2{font-size:24px;margin:18px 0 8px;font-weight:600}
h3{font-size:18px;margin:16px 0 6px;font-weight:600}
.sub{color:var(--mute);margin:4px 0 0;font-size:14px}
.app-header{margin-bottom:22px;position:relative}
.app-title{font-size:36px;font-weight:700;letter-spacing:-.03em;color:var(--ink);margin:0 0 8px;font-family:"Space Grotesk",sans-serif;line-height:1.1;background:linear-gradient(135deg,var(--ink),var(--mute));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.app-sub{color:var(--mute);font-size:14px;display:flex;align-items:center;gap:8px;font-weight:400}
.app-sub .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 8px var(--ok)}
.card{background:rgba(var(--card),var(--card-alpha));backdrop-filter:blur(16px) saturate(180%);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:14px 0;box-shadow:var(--shadow);transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.card:hover{box-shadow:var(--shadow-lg);border-color:rgba(59,130,246,0.3);transform:translateY(-2px)}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--acc),var(--warn));transform:scaleX(0);transform-origin:left;transition:transform .4s cubic-bezier(.4,0,.2,1)}
.card:hover::before{transform:scaleX(1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--radius-sm);font-family:"Inter",sans-serif;font-weight:600;font-size:14px;padding:12px 20px;cursor:pointer;transition:all .2s ease;flex:0 0 auto}
.btn-primary{background:linear-gradient(135deg,var(--acc),#2563eb);color:#fff;box-shadow:0 4px 14px -4px rgba(59,130,246,0.4)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px -8px rgba(59,130,246,0.5)}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{background:#f8fafc;color:var(--acc)}
.btn-small{padding:8px 14px;font-size:13px}
.btn-icon{padding:11px;width:38px;height:38px}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626;transform:translateY(-1px)}
.input-group{margin-bottom:16px}
.input-group label{display:block;font-size:11px;font-weight:600;color:var(--mute);margin-bottom:6px;letter-spacing:0.06em;text-transform:uppercase}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;width:100%;transition:all .2s ease}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px rgba(59,130,246,0.15)}
textarea{min-height:90px;resize:vertical}
.toggle-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle-row:last-child{border:none}
.toggle-row input{width:21px;height:21px;accent-color:var(--acc);margin-top:2px}
.toggle-label{flex:1;font-size:14px;color:var(--ink);cursor:pointer}
.toggle-label.done{color:var(--mute);text-decoration:line-through}
.skill{display:flex;align-items:center;gap:8px;padding:6px 0}
.skill span{flex:1;font-size:14px}
.skill input{flex:1.2;accent-color:var(--acc);padding:0}
.hero{padding:22px;border-radius:var(--radius)}
.big{font-family:"Space Grotesk",sans-serif;font-size:56px;font-weight:700;line-height:1.05;color:var(--warn);letter-spacing:-.02em}
.ruler{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0 8px}
.ruler i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--warn));border-radius:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ruler{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0 8px}
.ruler i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--warn));border-radius:4px}
.chk{display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:8px 0}
.chk input{flex:0 0 auto;width:21px;height:21px;margin:2px 0 0 0;accent-color:var(--acc)}
.chk span{flex:1;font-size:14px;color:var(--ink);line-height:1.45}
.chk.done span{color:var(--mute);text-decoration:line-through}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--warn));border-radius:4px;transition:width .6s ease}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;border:1px solid var(--line);color:var(--mute);margin:2px 4px 2px 0}
.pill.ok{color:var(--ok);border-color:rgba(34,197,94,0.35);background:rgba(34,197,94,0.06)}
.pill.warn{color:var(--warn);border-color:rgba(245,158,11,0.35);background:rgba(245,158,11,0.06)}
.pill.danger{color:var(--danger);border-color:rgba(239,68,68,0.35);background:rgba(239,68,68,0.06)}
.navbar{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;gap:16px;justify-content:space-around;background:rgba(var(--card),var(--card-alpha));backdrop-filter:blur(var(--nav-blur)) saturate(180%);border-top:1px solid var(--line);padding:10px 6px calc(16px + env(safe-area-inset-bottom,0px))}
.navbar a{flex:0 1 auto;text-align:center;color:var(--mute);text-decoration:none;font-size:12px;font-weight:600;padding:12px 8px;border-radius:14px;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative}
.navbar a:hover{background:rgba(59,130,246,0.08);color:var(--acc)}
.navbar a.active{color:var(--acc);background:linear-gradient(135deg,var(--acc),#2563eb);font-weight:600}
.navbar a.active::after{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:8px;height:8px;background:var(--acc);border-radius:50%;box-shadow:0 2px 6px rgba(59,130,246,0.4)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;transition:all .3s ease;pointer-events:none;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-8px)}
.empty{text-align:center;padding:36px 20px;color:var(--mute)}
.empty p{font-size:15px;margin-bottom:14px;font-weight:400}
.empty kbd{display:inline-block;background:var(--line);color:var(--ink);padding:4px 10px;border-radius:6px;font-size:12px;font-family:inherit}
input[type="checkbox"]{accent-color:var(--acc);width:21px;height:21px}
@media (min-width:600px){.app{max-width:560px}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const KEY='hasib-career-os-v1';
let S={psw:'',done:{},skills:{},log:[],jobs:[],notes:[],today:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const localSave=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let sb=null,user=null,syncMsg='Not signed in',authMsg='',pushTimer=null;
const SB_URL='https://fcbopqmjdopljbuybxyn.supabase.co';
const SB_KEY='sb_publishable_AGwSr2ernXXxJ4ncTjpyTw_xeGGs0YB';
try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){sb=null}
const setSync=m=>{syncMsg=m;const el=document.getElementById('sync');if(el)el.textContent=(user?user.email+' · ':'')+m};
const save=()=>{localSave();clearTimeout(pushTimer);pushTimer=setTimeout(push,800)};
async function push(){
 if(!sb||!user)return;
 setSync('Saving…');
 const {error}=await sb.from('career_state').upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()});
 setSync(error?'Sync error: '+error.message:'Saved to cloud');
}
async function pull(){
 const {data,error}=await sb.from('career_state').select('data').eq('user_id',user.id).maybeSingle();
 if(error){setSync('Sync error: '+error.message);return}
 if(data&&data.data&&Object.keys(data.data).length){Object.assign(S,data.data);localSave();setSync('Loaded from cloud')}
 else{await push()}
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const todayStr=()=>new Date().toISOString().slice(0,10);

const PHASES=[
{n:'Months 1–2: Strong base',t:['Python and pandas practice, 1 hour a day','Solve 30 SQL problems (joins, window functions)','Clean up the MSc GNN repo on GitHub with a clear README','Write a 2-page UK-style CV','Fix LinkedIn headline, summary and skills']},
{n:'Months 3–5: Portfolio',t:['Build a Streamlit demo of the METR-LA traffic forecast','Finish one SQL and dashboard project','Build a small LLM or document-search app','Do one Kaggle time-series project','Write one case study: what you built and what you found']},
{n:'Months 6–9: Start applying',t:['List 100 UK companies on the sponsor licence register','Apply to 15–25 tailored roles a week','Message 5 people a week (alumni, recruiters, engineers)','Tailor CV to each job description','Track every application in the Jobs tab']},
{n:'Months 10–15: Interview ready',t:['Practise SQL and Python interview questions weekly','Prepare answers for each project: why, how, what went wrong','Learn Docker and FastAPI basics, deploy one model','Take a cloud fundamentals course (AWS or Azure)','Do 5 mock interviews']},
{n:'Months 16–24: Secure sponsorship',t:['Check Skilled Worker salary and code rules on gov.uk','Ask every employer about sponsorship early','Compare offers: salary, sponsor licence, visa support','Start the visa switch at least 3 months before PSW ends','Keep a backup plan: more roles, wider cities']}];
const SKILLS=['Python','SQL','Statistics','Machine learning','Deep learning (PyTorch)','Time series and GNN','Docker, Git, deployment','Cloud basics','Interview and communication'];
const STAT=['Saved','Applied','Interview','Offer','Rejected'];
const TABS=[['home','Home'],['roadmap','Roadmap'],['learn','Learn'],['jobs','Jobs'],['notes','Notes']];

function pct(){let a=0,d=0;PHASES.forEach((p,i)=>p.t.forEach((_,j)=>{a++;if(S.done['p'+i+'t'+j])d++}));return{a,d,p:a?Math.round(d/a*100):0}}
function weekHours(){const c=Date.now()-7*864e5;return S.log.filter(l=>new Date(l.d).getTime()>=c).reduce((s,l)=>s+l.h,0)}

function home(){
 let hero='';
 if(S.psw){
  const left=Math.ceil((new Date(S.psw)-Date.now())/864e5);
  const used=Math.min(100,Math.max(0,Math.round((730-left)/730*100)));
  hero=`<div class="card hero"><div class="sub">Days left on your Graduate visa</div><div class="big">${left>0?left:0}</div>
  <div class="ruler"><i style="width:${used}%"></i></div><div class="sub">${used}% of the 2-year window used. Target: a sponsored job before it ends.</div>
  <div class="row" style="margin-top:10px"><label class="sub">Visa end date <input type="date" value="${esc(S.psw)}" onchange="setPsw(this.value)"></label></div></div>`;
 }else{
  hero=`<div class="card hero"><h3>Set your visa end date</h3><p class="sub">Every plan here counts back from this date.</p>
  <input type="date" id="pswIn"> <button onclick="setPsw($('pswIn').value)">Save date</button></div>`;
 }

 const ukCareerRoadmap = `
 <div class="card" style="background:linear-gradient(135deg,rgba(59,130,246,0.06),rgba(245,158,11,0.04))">
   <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
    <span style="font-size:24px">🤖</span>
    <h2 style="margin:0">UK Career & Skill Gap Roadmap</h2>
   </div>
   <p class="sub">Current Profile Match: MSc AI & Data Science (University of Hull), Python, IoT, WordPress & Digital Marketing background.</p><p class="sub">UK Job Market Skill Gaps (What to Learn Next): High-demand UK tech skills to bridge the gap — MLOps & Model Deployment, Cloud/AWS, Advanced Pandas/SQL analytics, PyTorch/TensorFlow production.</p>
   <p class="sub" style="margin-top:12px">Automated Roadmap Progress — Skill acquisition tracker</p>
   <div class="progress" style="margin-top:4px"><div class="progress-fill" id="roadmapProgress" style="width:0%"></div></div>
   <div class="row" style="margin-top:6px;gap:8px"><span class="sub" style="flex:1;font-size:12px">0% complete</span></div>
   <div class="ruler"><i style="width: 75%;"></i></div>
   <div id="ukRoadmapContent" style="margin-top:12px;font-size:14px;line-height:1.6;color:var(--ink)"><div class="sub">Loading roadmap…</div></div>
 </div>`;

 const r=pct(),jobs=S.jobs,td=todayStr(),T=S.today[td]||{};
 const daily=[['learn','Learn for 1.5 hours'],['build','Work on a project for 30 minutes'],['apply','Apply or network for 30 minutes']];
 const next=[];PHASES.forEach((p,i)=>p.t.forEach((t,j)=>{if(!S.done['p'+i+'t'+j]&&next.length<3)next.push(t)}));
 return `<h1>Hasibur’s Career OS</h1><p class="sub">MSc AI and Data Science → a sponsored data or ML role in the UK</p>${hero}${ukCareerRoadmap}${account()}
 <div class="grid"><div class="card stat"><b>${r.p}%</b><span>Roadmap done</span></div>
 <div class="card stat"><b>${weekHours()}h</b><span>Learning this week (goal 10h)</span></div>
 <div class="card stat"><b>${jobs.filter(j=>j.s!=='Saved').length}</b><span>Applications sent</span></div>
 <div class="card stat"><b>${jobs.filter(j=>j.s==='Interview'||j.s==='Offer').length}</b><span>Interviews and offers</span></div></div>
 <h2>Today</h2><div class="card">${daily.map(([k,l])=>`<label class="chk ${T[k]?'done':''}"><input type="checkbox" ${T[k]?'checked':''} onchange="tick('${k}',this.checked)"><span>${l}</span></label>`).join('')}</div>
 <h2>Next up on the roadmap</h2><div class="card">${next.length?next.map(t=>`<div class="chk" style="display:block;padding:6px 0">${esc(t)}</div>`).join(''):'<div class="empty">Every roadmap task is done.</div>'}</div>`;
}

function roadmap(){
 return `<h1>Roadmap</h1><p class="sub">24 months, five phases. Tick tasks as you finish them.</p>`+PHASES.map((p,i)=>{
  const d=p.t.filter((_,j)=>S.done['p'+i+'t'+j]).length,w=Math.round(d/p.t.length*100);
  return `<div class="card"><h3>${p.n}</h3><div class="bar"><i style="width:${w}%"></i></div>${p.t.map((t,j)=>{const k='p'+i+'t'+j,c=S.done[k];
   return `<label class="chk ${c?'done':''}"><input type="checkbox" ${c?'checked':''} onchange="toggle('${k}',this.checked)"><span>${esc(t)}</span></label>`}).join('')}</div>`}).join('');
}
function learn(){
 const recent=S.log.slice(-6).reverse();
 return `<h1>Learn</h1><p class="sub">Rate yourself from 0 to 5 and re-rate every month.</p>
 <div class="card">${SKILLS.map(s=>`<div class="skill"><span>${s}</span><input type="range" min="0" max="5" value="${S.skills[s]||0}" onchange="setSkill('${s}',this.value)" aria-label="${s}"><b>${S.skills[s]||0}</b></div>`).join('')}</div>
 <h2>Log a study session</h2><div class="card"><div class="row"><input id="lh" type="number" min="0.25" step="0.25" placeholder="Hours" style="width:90px"><input id="lt" placeholder="What did you study?" style="flex:1;min-width:140px"><button onclick="addLog()">Add session</button></div>
 <p class="sub">This week: ${weekHours()}h of 10h goal</p>
 ${recent.length?recent.map(l=>`<div class="chk" style="display:block;padding:5px 0"><b>${l.h}h</b> ${esc(l.t)} <span class="sub">${esc(l.d)}</span></div>`).join(''):'<div class="empty">No sessions yet. Log your first one above.</div>'}</div>`;
}
function jobs(){
 return `<h1>Jobs</h1><p class="sub">Mark roles that offer visa sponsorship. Those matter most.</p>
 <div class="card"><div class="row"><input id="jc" placeholder="Company" style="flex:1;min-width:120px"><input id="jr" placeholder="Role" style="flex:1;min-width:120px"></div>
 <div class="row" style="margin-top:8px"><label><input type="checkbox" id="js"> Sponsors visas</label><button onclick="addJob()">Add job</button></div></div>
 ${S.jobs.length?S.jobs.map((j,i)=>`<div class="card"><div class="row"><b style="flex:1">${esc(j.c)}</b>${j.sp?'<span class="pill ok">Sponsors</span>':''}</div>
 <div class="sub">${esc(j.r)}</div><div class="row" style="margin-top:8px"><select onchange="setJob(${i},this.value)">${STAT.map(s=>`<option ${s===j.s?'selected':''}>${s}</option>`).join('')}</select><button class="ghost" onclick="delJob(${i})">Remove</button></div></div>`).join(''):'<div class="empty">No jobs tracked yet. Add the first role you find.</div>'}`;
}
let q='';
function notes(){
 const list=S.notes.map((n,i)=>({n,i})).filter(x=>x.n.t.toLowerCase().includes(q.toLowerCase())).reverse();
 return `<h1>Notes</h1><p class="sub">Ideas, interview answers, things to remember.</p>
 <div class="card"><textarea id="nt" placeholder="What’s on your mind?"></textarea><div class="row" style="margin-top:8px"><button onclick="addNote()">Save note</button></div></div>
 <input id="nq" placeholder="Search notes" value="${esc(q)}" oninput="q=this.value;go(true)" style="width:100%">
 ${list.length?list.map(x=>`<div class="card"><div style="white-space:pre-wrap">${esc(x.n.t)}</div><div class="row" style="margin-top:8px"><span class="sub" style="flex:1">${esc(x.n.d)}</span><button class="ghost" onclick="delNote(${x.i})">Delete</button></div></div>`).join(''):'<div class="empty">Nothing here yet.</div>'}`;
}
const VIEWS={home,roadmap,learn,jobs,notes};
function go(keepFocus){
 const v=VIEWS[location.hash.slice(1)]?location.hash.slice(1):'home';
 $('app').innerHTML=VIEWS[v]();
 $('nav').innerHTML=TABS.map(([k,l])=>`<a href="#${k}" class="${k===v?'on':''}">${l}</a>`).join('');
 if(keepFocus&&v==='notes'){const e=$('nq');e.focus();e.setSelectionRange(q.length,q.length)}
 if(v==='home')loadBrief();
}
async function loadBrief(){
 const el=$('ukRoadmapContent');if(!el)return;
 try{const r=await fetch('jobs.json');const d=await r.json();el.innerHTML=(d.brief||'UK Career & Skill Gap Roadmap data unavailable.').replace(/\n/g,'<br>');}catch(e){el.innerHTML='<div class="sub">Roadmap data unavailable.</div>';}
}
function setPsw(v){if(!v)return;S.psw=v;save();go()}
function tick(k,c){const d=todayStr();S.today[d]=S.today[d]||{};S.today[d][k]=c;save();go()}
function toggle(k,c){S.done[k]=c;save();go()}
function setSkill(s,v){S.skills[s]=+v;save();go()}
function addLog(){const h=parseFloat($('lh').value),t=$('lt').value.trim();if(!h||!t)return;S.log.push({h,t,d:todayStr()});save();go()}
function addJob(){const c=$('jc').value.trim(),r=$('jr').value.trim();if(!c||!r)return;S.jobs.push({c,r,s:'Saved',sp:$('js').checked});save();go()}
function setJob(i,v){S.jobs[i].s=v;save();go()}
function delJob(i){S.jobs.splice(i,1);save();go()}
function addNote(){const t=$('nt').value.trim();if(!t)return;S.notes.push({t,d:todayStr()});save();go()}
function delNote(i){S.notes.splice(i,1);save();go()}
function account(){
 if(!sb)return `<div class="card"><div class="sub">Cloud save is unavailable right now. Your data is still saved on this device.</div></div>`;
 if(user)return `<div class="card"><div class="row"><span id="sync" class="sub" style="flex:1">${esc(user.email)} · ${esc(syncMsg)}</span><button class="ghost" onclick="signOut()">Sign out</button></div></div>`;
 return `<div class="card"><h3>Save to the cloud</h3><p class="sub">Sign in to use the same data on your phone and laptop.</p>
 <div class="row"><input id="em" type="email" placeholder="Email" autocomplete="email" style="flex:1;min-width:150px"><input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" style="flex:1;min-width:150px"></div>
 <div class="row" style="margin-top:8px"><button onclick="signIn()">Sign in</button><button class="ghost" onclick="signUp()">Create account</button></div>
 <p class="sub" id="authmsg">${esc(authMsg)}</p></div>`;
}
const cred=()=>({email:$('em').value.trim(),password:$('pw').value});
function say(m){authMsg=m;const e=$('authmsg');if(e)e.textContent=m}
async function signUp(){
 const c=cred();if(!c.email||c.password.length<6){say('Enter an email and a password of 6+ characters.');return}
 say('Creating account…');
 const {data,error}=await sb.auth.signUp(c);
 if(error){say(error.message);return}
 if(!data.session)say('Account created. Check your email to confirm, then sign in.');
}
async function signIn(){
 const c=cred();if(!c.email||!c.password){say('Enter your email and password.');return}
 say('Signing in…');
 const {error}=await sb.auth.signInWithPassword(c);
 if(error)say(error.message);
}
async function signOut(){await sb.auth.signOut()}
if(sb){sb.auth.onAuthStateChange((ev,sess)=>{
 user=sess?sess.user:null;
 if(user){setTimeout(async()=>{await pull();go()},0)}
 else{syncMsg='Not signed in';setTimeout(go,0)}
});}
window.addEventListener('hashchange',()=>go());
go();
</script>
